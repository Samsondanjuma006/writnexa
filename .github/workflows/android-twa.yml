name: Build Writnexa Android TWA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x twa/gradlew

      - name: Build release AAB
        working-directory: twa
        run: ./gradlew bundleRelease

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: writnexa-unsigned-aab
          path: twa/app/build/outputs/bundle/release/app-release.aab
